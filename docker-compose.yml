services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-please-set-a-long-random-secret-key-in-env}
    volumes:
      - db-data:/data-volume
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
